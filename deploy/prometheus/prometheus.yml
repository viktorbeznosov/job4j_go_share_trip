global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "sharetrip"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "notification"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
